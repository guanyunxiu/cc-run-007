<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>直播白板 · 低延迟同步</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 加入房间 -->
  <section id="joinView" class="join-view">
    <div class="join-card">
      <h1>直播白板</h1>
      <p class="subtitle">低延迟笔迹同步 · 贝塞尔平滑 · 断线自动重连</p>
      <label>
        房间号
        <input id="roomInput" type="text" maxlength="32" placeholder="例如 room-101" autocomplete="off" />
      </label>
      <label>
        昵称（可选）
        <input id="nameInput" type="text" maxlength="20" placeholder="匿名用户" autocomplete="off" />
      </label>
      <button id="joinBtn" type="button">加入房间</button>
      <p class="hint">同一房间号的浏览器窗口会实时互相同步笔迹</p>
    </div>
  </section>

  <!-- 白板主界面 -->
  <main id="boardView" class="board-view hidden">
    <header class="toolbar">
      <div class="brand">📝 直播白板</div>

      <div class="colors" id="colorPalette" role="group" aria-label="颜色">
        <button class="color active" data-color="#1f2937" style="background:#1f2937" title="黑色"></button>
        <button class="color" data-color="#ef4444" style="background:#ef4444" title="红色"></button>
        <button class="color" data-color="#f59e0b" style="background:#f59e0b" title="橙色"></button>
        <button class="color" data-color="#10b981" style="background:#10b981" title="绿色"></button>
        <button class="color" data-color="#3b82f6" style="background:#3b82f6" title="蓝色"></button>
        <button class="color" data-color="#8b5cf6" style="background:#8b5cf6" title="紫色"></button>
      </div>

      <label class="size-control">
        线宽
        <input id="sizeRange" type="range" min="1" max="20" step="0.5" value="3" />
        <span id="sizeValue">3</span>
      </label>

      <div class="spacer"></div>

      <div class="room-info">
        <span id="roomTag" class="room-tag"></span>
        <span id="peerTag" class="peer-tag">👤 1</span>
      </div>

      <div id="statusPill" class="status-pill connecting">
        <span class="dot"></span><span id="statusText">连接中…</span>
      </div>

      <button id="leaveBtn" class="leave-btn" type="button">离开</button>
    </header>

    <div class="canvas-wrap">
      <canvas id="board"></canvas>
    </div>

    <footer class="statusbar">
      <span id="userIdTag"></span>
      <span class="sep">|</span>
      <span>已同步 seq：<b id="seqTag">0</b></span>
      <span class="sep">|</span>
      <span id="pendingTag">待发送：0</span>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
